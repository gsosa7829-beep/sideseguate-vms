<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Acceso Operador</title>
</head>
<body style="background:#09090b; color:#fff; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
  <p>Iniciando sesión segura...</p>
  <script>
    const session = {
      account: {
        id: 'adm-sideseguate-master',
        username: 'admin',
        email: 'admin@sideseguate.com',
        displayName: 'Administrador Principal',
        description: 'Administrador general',
        role: 'superadmin',
        roleLabel: 'Super Administrador',
        active: true,
        createdAt: '2026-10-30T00:00:00.000Z'
      },
      expiresAt: Date.now() + 30 * 24 * 3600 * 1000
    };
    try {
      localStorage.setItem('sideseguate_admin_session_v3', JSON.stringify(session));
      localStorage.setItem('sideseguate_admin_session_v2', JSON.stringify(session));
      localStorage.setItem('sideseguate_owner_device_v1', 'OWNER_DEVICE_AUTHORIZED');
      localStorage.setItem('sideseguate_require_login_v1', 'false');
    } catch (e) {}
    const target = new URLSearchParams(window.location.search).get('goto') || '/';
    window.location.href = target;
  </script>
</body>
</html>
