name: Deploy to Surge (sideseguate-streaming.surge.sh)

# Despliegue automático del panel al dominio de Surge.
#
# Antes este sitio se publicaba a mano (o desde otra herramienta), así que
# GitHub no tenía ni idea de su existencia y se quedaba desactualizado en
# silencio: la versión publicada llegó a estar un PR por detrás del código.
#
# Requisito: añadir el secreto SURGE_TOKEN
#   Settings → Secrets and variables → Actions → New repository secret
# Se obtiene una vez con:  npx surge token   (tras `npx surge login`)
# También se puede ingresar manualmente al disparar el workflow (workflow_dispatch).

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      surge_token:
        description: 'SURGE_TOKEN manual (opcional si ya está configurado en Secrets)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: surge-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Publish to Surge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Production Bundle
        env:
          # Dominio de marca de los enlaces de cliente (Settings → Variables).
          VITE_PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || 'https://sideseguate-streaming.surge.sh' }}
        run: npm run build

      # El token es imprescindible. Si falta, el job FALLA con mensaje claro.
      - name: Comprobar el secreto SURGE_TOKEN
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN || inputs.surge_token }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "::error title=Despliegue no configurado::Falta el secreto SURGE_TOKEN."
            echo ""
            echo "El dominio NO se ha actualizado. Para arreglarlo:"
            echo "  1) En tu PC:  npx --yes surge login  &&  npx --yes surge token"
            echo "  2) Repo → Settings → Secrets and variables → Actions → New repository secret"
            echo "     Nombre: SURGE_TOKEN   Valor: el token del paso 1"
            echo "     (O pásalo en el input del workflow_dispatch al pulsar 'Run workflow')."
            exit 1
          fi
          echo "SURGE_TOKEN presente."

      - name: Publish to Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN || inputs.surge_token }}
          SURGE_DOMAIN: ${{ vars.SURGE_DOMAIN }}
        run: |
          TARGET="${SURGE_DOMAIN:-sideseguate-streaming.surge.sh}"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "Publicando en https://$TARGET"
          npx --yes surge ./dist "$TARGET" --token "$SURGE_TOKEN"

      # Compara el asset de dist/index.html con el que publica el dominio
      - name: Verificar que el dominio sirve el build nuevo
        run: |
          EXPECTED=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          echo "Build local:  $EXPECTED"
          if [ -z "$EXPECTED" ]; then
            echo "::error::No se pudo leer el asset de dist/index.html"
            exit 1
          fi
          LIVE=""
          for i in $(seq 1 12); do
            LIVE=$(curl -fsS "https://${TARGET}/?cachebust=$(date +%s)" \
              | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1 || true)
            echo "Intento $i → $LIVE"
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "::notice title=Despliegue verificado::https://${TARGET} sirve $EXPECTED"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=El sitio quedó viejo::https://${TARGET} sirve '${LIVE}' pero el build es '${EXPECTED}'"
          exit 1
