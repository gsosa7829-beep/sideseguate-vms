name: Deploy to Surge (global-tech.surge.sh)

# Despliegue automático del panel al dominio oficial de Surge: global-tech.surge.sh (y espejo compatible proyectos-de-camaras.surge.sh).

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      surge_token:
        description: 'SURGE_TOKEN manual (opcional si ya está configurado en Secrets)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: surge-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Publish to Surge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Production Bundle
        run: |
          APP_URL="${{ vars.PUBLIC_APP_URL }}"
          case "$APP_URL" in
            ""|*proyectos-de-camaras*)
              APP_URL="https://global-tech.surge.sh"
              ;;
          esac
          echo "Compilando con VITE_PUBLIC_APP_URL=$APP_URL"
          VITE_PUBLIC_APP_URL="$APP_URL" npm run build

      - name: Comprobar el secreto SURGE_TOKEN
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN || inputs.surge_token }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "::error title=Despliegue no configurado::Falta el secreto SURGE_TOKEN."
            exit 1
          fi
          echo "SURGE_TOKEN presente."

      - name: Publish to Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN || inputs.surge_token }}
        run: |
          REQ_DOMAIN="${{ vars.SURGE_DOMAIN }}"
          case "$REQ_DOMAIN" in
            ""|*proyectos-de-camaras*)
              TARGET="global-tech.surge.sh"
              ;;
            *)
              TARGET="$REQ_DOMAIN"
              ;;
          esac
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"

          echo "$TARGET" > dist/CNAME
          cp dist/index.html dist/200.html
          echo "Publicando en https://$TARGET"
          npx --yes surge ./dist "$TARGET" --token "$SURGE_TOKEN"

          if [ "$TARGET" != "global-tech.surge.sh" ]; then
            echo "global-tech.surge.sh" > dist/CNAME
            echo "Sincronizando en https://global-tech.surge.sh"
            npx --yes surge ./dist "global-tech.surge.sh" --token "$SURGE_TOKEN"
          fi

          if [ "$TARGET" != "proyectos-de-camaras.surge.sh" ]; then
            echo "proyectos-de-camaras.surge.sh" > dist/CNAME
            echo "Sincronizando espejo compatible en https://proyectos-de-camaras.surge.sh"
            npx --yes surge ./dist "proyectos-de-camaras.surge.sh" --token "$SURGE_TOKEN"
          fi

      - name: Verificar que el dominio sirve el build nuevo
        run: |
          EXPECTED=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          echo "Build local:  $EXPECTED"
          if [ -z "$EXPECTED" ]; then
            echo "::error::No se pudo leer el asset de dist/index.html"
            exit 1
          fi
          for DOM in $(printf '%s\n' "$TARGET" "global-tech.surge.sh" "proyectos-de-camaras.surge.sh" | awk 'NF && !seen[$0]++'); do
            LIVE=""
            OK=0
            for i in $(seq 1 12); do
              LIVE=$(curl -fsS "https://${DOM}/?cachebust=$(date +%s)" \
                | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1 || true)
              echo "[$DOM] Intento $i → $LIVE"
              if [ "$LIVE" = "$EXPECTED" ]; then
                echo "::notice title=Despliegue verificado::https://${DOM} sirve $EXPECTED"
                OK=1
                break
              fi
              sleep 10
            done
            if [ "$OK" -ne 1 ]; then
              echo "::error title=El sitio quedó viejo::https://${DOM} sirve '${LIVE}' pero el build es '${EXPECTED}'"
              exit 1
            fi
          done
