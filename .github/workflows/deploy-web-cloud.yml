name: Deploy SIDESEGUATE Web Platform 24/7 (Cloud Branch)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/hik-p2p-cloud-server.yml'
      - 'cloud-p2p-runner.ps1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sideseguate-web-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Publish Web Console to gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Production Bundle
        env:
          # Dominio de marca de los enlaces de cliente.
          # Por omisión usa el dominio de producción sideseguate-cloud.surge.sh
          # evitando que los enlaces muestren el usuario personal de GitHub.
          VITE_PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || 'https://sideseguate-cloud.surge.sh' }}
        run: |
          npm ci
          npm run build

      - name: Publish Production Build to gh-pages Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          git init
          git config user.name "gsosa7829-beep"
          git config user.email "gsosa7829@gmail.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "deploy(cloud-web): automated 24/7 web build"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
