    <script>
      (function() {
        // Ensure window.fetch has both getter and setter so Chrome extensions can safely wrap/intercept it
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var _currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(newFetch) {
              _currentFetch = newFetch;
            }
          });
        } catch (e) {
          // Fallback if defineProperty fails
        }

        // Suppress external chrome-extension errors from polluting app error reporting
        window.addEventListener('error', function(e) {
          if (e.filename && e.filename.indexOf('chrome-extension://') !== -1) {
            e.preventDefault();
            e.stopPropagation();
            return true;
          }
          if (e.message && e.message.indexOf('Cannot set property fetch of #<Window>') !== -1) {
            e.preventDefault();
            e.stopPropagation();
            return true;
          }
        }, true);
      })();
    </script>
