logLevel: info
logDestinations: [stdout, file]
logFile: mediamtx.log

# API de Control y Estado en Tiempo Real
api: yes
apiAddress: :9997

# RTSP Server
rtsp: yes
protocols: [tcp]
rtspAddress: :8554

# WebRTC Server (Baja latencia ~200ms WHEP para navegador web)
